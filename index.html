<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium App Store</title>
    
    <!-- Font Simple & Elegan -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    
    <style>
        /* === TEMA BLACK & WHITE === */
        :root {
            --bg-color: #050505;
            --card-bg: #121212;
            --border-color: #333333;
            --text-main: #FFFFFF;
            --text-muted: #888888;
            --accent: #FFFFFF; /* Warna aksen putih */
            --accent-text: #000000; /* Teks di atas warna aksen */
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); line-height: 1.6; padding-bottom: 50px; }

        /* HEADER */
        header { text-align: center; padding: 40px 20px; border-bottom: 1px solid var(--border-color); margin-bottom: 40px; }
        header h1 { font-weight: 800; font-size: 2rem; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 10px; }
        header p { color: var(--text-muted); font-size: 0.95rem; }

        /* KONTAINER UTAMA */
        .container { max-width: 1000px; margin: 0 auto; padding: 0 20px; }

        /* GRID PRODUK */
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 20px; }
        
        /* KARTU PRODUK */
        .card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 12px; overflow: hidden; transition: 0.3s; display: flex; flex-direction: column; }
        .card:hover { border-color: var(--accent); transform: translateY(-5px); }
        
        .card-img { width: 100%; aspect-ratio: 1/1; background: #000; object-fit: cover; border-bottom: 1px solid var(--border-color); }
        .card-body { padding: 20px; display: flex; flex-direction: column; flex: 1; text-align: center; }
        .card-title { font-size: 1.1rem; font-weight: 600; margin-bottom: 5px; }
        .card-price { font-size: 1.2rem; font-weight: 800; margin-bottom: 20px; }
        
        /* TOMBOL BELI */
        .btn { background: var(--accent); color: var(--accent-text); border: none; padding: 12px; border-radius: 8px; font-weight: 800; font-size: 0.9rem; cursor: pointer; transition: 0.3s; text-transform: uppercase; margin-top: auto; }
        .btn:hover { background: #dddddd; }

        /* MODAL POP UP (STRUKTUR SAMA KAYA NULL STORE TAPI VERSI SIMPLE) */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); backdrop-filter: blur(5px); display: none; justify-content: center; align-items: center; z-index: 1000; }
        .modal-box { background: var(--card-bg); border: 1px solid var(--border-color); width: 90%; max-width: 400px; border-radius: 16px; padding: 25px; position: relative; }
        .close-btn { position: absolute; top: 15px; right: 15px; background: none; border: none; color: var(--text-muted); font-size: 1.5rem; cursor: pointer; }
        .close-btn:hover { color: var(--accent); }
        
        .modal-title { font-size: 1.3rem; font-weight: 800; margin-bottom: 5px; border-bottom: 1px solid var(--border-color); padding-bottom: 15px; }
        .modal-desc { font-size: 0.9rem; color: var(--text-muted); margin: 15px 0; white-space: pre-line; }
        
        .input-group { margin-bottom: 20px; text-align: left; }
        .input-group label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 8px; color: var(--text-muted); }
        .input-group input { width: 100%; padding: 12px; background: #000; border: 1px solid var(--border-color); color: #fff; border-radius: 8px; font-family: 'Inter'; outline: none; }
        .input-group input:focus { border-color: var(--accent); }

        .total-box { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; font-size: 1.2rem; font-weight: 800; }
    </style>
</head>
<body>

    <!-- HEADER / JUDUL TOKO -->
    <header>
        <!-- NAMA TOKO TEMEN LU GANTI DI SINI -->
        <h1>Premium App Store</h1>
        <p>Layanan Aplikasi Premium Terpercaya & Termurah.</p>
    </header>

    <div class="container">
        <!-- WADAH DAFTAR PRODUK -->
        <div class="grid">

            <!-- ================= MULAI PRODUK 1 ================= -->
            <div class="card">
                <!-- GAMBAR PRODUK: Ganti nama file gambar di src="gambar.png" -->
                <img src="netflix.png" alt="Netflix" class="card-img" onerror="this.src='https://via.placeholder.com/300x300/000000/ffffff?text=NETFLIX'">
                <div class="card-body">
                    <div class="card-title">Netflix 1 Bulan (Sharing)</div>
                    <div class="card-price">Rp 25.000</div>
                    
                    <!-- FUNGSI KLIK: bukaModal('Judul', HargaAngka, 'Deskripsi') -->
                    <button class="btn" onclick="bukaModal('Netflix 1 Bulan (Sharing)', 25000, '• 1 Profil 1 User\n• Dilarang ubah password\n• Garansi full 1 bulan')">Beli Sekarang</button>
                </div>
            </div>
            <!-- ================= AKHIR PRODUK 1 ================= -->

            <!-- ================= MULAI PRODUK 2 ================= -->
            <div class="card">
                <img src="spotify.png" alt="Spotify" class="card-img" onerror="this.src='https://via.placeholder.com/300x300/000000/ffffff?text=SPOTIFY'">
                <div class="card-body">
                    <div class="card-title">Spotify Premium 1 Bulan</div>
                    <div class="card-price">Rp 15.000</div>
                    <button class="btn" onclick="bukaModal('Spotify Premium 1 Bulan', 15000, '• Akun dari pembeli / email sendiri\n• Garansi full tanpa back to free\n• Bebas iklan')">Beli Sekarang</button>
                </div>
            </div>
            <!-- ================= AKHIR PRODUK 2 ================= -->

            <!-- ================= MULAI PRODUK 3 ================= -->
            <div class="card">
                <img src="canva.png" alt="Canva" class="card-img" onerror="this.src='https://via.placeholder.com/300x300/000000/ffffff?text=CANVA'">
                <div class="card-body">
                    <div class="card-title">Canva Pro 1 Bulan</div>
                    <div class="card-price">Rp 10.000</div>
                    <button class="btn" onclick="bukaModal('Canva Pro 1 Bulan', 10000, '• Join via invite link\n• Pakai email sendiri\n• Fitur pro terbuka semua')">Beli Sekarang</button>
                </div>
            </div>
            <!-- ================= AKHIR PRODUK 3 ================= -->

            <!-- TEMEN LU BISA COPY PASTE BLOK PRODUK DI ATAS KALAU MAU NAMBAH PRODUK BARU -->

        </div>
    </div>

    <!-- ================= MODAL / POP UP CHECKOUT ================= -->
    <div class="modal-overlay" id="checkoutModal">
        <div class="modal-box">
            <button class="close-btn" onclick="tutupModal()">×</button>
            
            <div class="modal-title" id="modalTitle">Nama Produk</div>
            <div class="modal-desc" id="modalDesc">Deskripsi produk di sini...</div>
            
            <div class="input-group">
                <label>Nomor WhatsApp Kamu</label>
                <input type="number" id="inputWa" placeholder="Contoh: 08123456789">
            </div>

            <div class="total-box">
                <span>Total:</span>
                <span id="modalPrice">Rp 0</span>
            </div>

            <button class="btn" style="width: 100%;" onclick="lanjutKeWA()">Lanjut ke WhatsApp</button>
        </div>
    </div>

    <!-- ================= JAVASCRIPT SISTEM ================= -->
    <script>
        // Variabel untuk nyimpen data pesanan sementara
        let orderData = {
            judul: '',
            harga: 0
        };

        // Fungsi Buka Pop Up
        function bukaModal(judul, harga, deskripsi) {
            orderData.judul = judul;
            orderData.harga = harga;
            
            document.getElementById('modalTitle').innerText = judul;
            document.getElementById('modalDesc').innerText = deskripsi;
            document.getElementById('modalPrice').innerText = 'Rp ' + harga.toLocaleString('id-ID');
            
            document.getElementById('checkoutModal').style.display = 'flex';
        }

        // Fungsi Tutup Pop Up
        function tutupModal() {
            document.getElementById('checkoutModal').style.display = 'none';
        }

        // Fungsi Lanjut ke WA Admin
        function lanjutKeWA() {
            let noWaPembeli = document.getElementById('inputWa').value;
            
            if(!noWaPembeli) {
                alert("Isi nomor WhatsApp dulu ya!");
                return;
            }

            // GANTI NOMOR WA ADMIN (TEMEN LU) DI BAWAH INI
            // Format wajib pakai awalan 62 tanpa spasi/tanda plus
            let noWaAdmin = "6281234567890"; 

            let pesan = `Halo Admin, saya mau order:\n\n` +
                        `🛒 Produk: ${orderData.judul}\n` +
                        `💰 Harga: Rp ${orderData.harga.toLocaleString('id-ID')}\n` +
                        `📱 WA Saya: ${noWaPembeli}\n\n` +
                        `Minta instruksi pembayarannya ya!`;

            let linkWa = `https://wa.me/${noWaAdmin}?text=${encodeURIComponent(pesan)}`;
            
            // Buka tab baru ke WhatsApp
            window.open(linkWa, '_blank');
            tutupModal();
        }
    </script>
</body>
</html>
