<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fake Notif Saldo</title>
    
    <!-- Menggunakan font tulisan tangan biar mirip kayak di foto -->
    <link href="https://fonts.googleapis.com/css2?family=Itim&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        /* === TEMA UI APLIKASI (MIRIP FOTO KE 2) === */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #0b1120; /* Warna biru super gelap */
            color: #fff;
            font-family: 'Itim', cursive; /* Font ala tulisan tangan */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .main-card {
            border: 2px solid #3b82f6; /* Garis biru terang */
            border-radius: 15px;
            padding: 30px 20px;
            width: 100%;
            max-width: 350px;
            background-color: rgba(11, 17, 32, 0.8);
            box-shadow: 0 0 20px rgba(59, 130, 246, 0.2);
        }

        .input-group {
            margin-bottom: 20px;
            text-align: center;
        }

        .input-group label {
            display: block;
            margin-bottom: 10px;
            font-size: 1.1rem;
            letter-spacing: 0.5px;
        }

        /* Styling buat Dropdown & Input Teks */
        .custom-input {
            background-color: transparent;
            border: 2px solid #3b82f6;
            border-radius: 10px;
            padding: 12px 15px;
            color: #94a3b8;
            font-family: 'Itim', cursive;
            font-size: 1rem;
            text-align: center;
            width: 100%;
            outline: none;
            transition: 0.3s;
        }

        .custom-input:focus {
            background-color: rgba(59, 130, 246, 0.1);
            color: #fff;
        }
        
        .custom-input option {
            background-color: #0b1120;
            color: #fff;
        }

        /* Styling Timer Area */
        .timer-label {
            text-align: center;
            margin-bottom: 15px;
            font-size: 1.1rem;
        }

        .timer-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            margin-bottom: 25px;
        }

        .btn-timer {
            background-color: transparent;
            border: 2px solid #3b82f6;
            border-radius: 10px;
            color: #fff;
            padding: 10px 5px;
            font-family: 'Itim', cursive;
            font-size: 0.9rem;
            cursor: pointer;
            transition: 0.3s;
            display: flex;
            flex-direction: column;
            align-items: center;
            line-height: 1.2;
        }

        .btn-timer:hover, .btn-timer.active {
            background-color: #3b82f6;
            color: #000;
            font-weight: bold;
        }

        /* Warning Box */
        .warning-box {
            border: 1px solid #3b82f6;
            border-radius: 10px;
            padding: 15px;
            text-align: center;
            font-size: 0.85rem;
            color: #4ade80; /* Warna hijau neon */
            line-height: 1.5;
        }

        .warning-box span {
            color: #fbbf24; /* Warna kuning buat highlight */
        }

        /* Layar Loading Hitung Mundur (Opsional biar asik) */
        #countdown-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            display: none;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            z-index: 1000;
        }
        #countdown-number {
            font-size: 5rem;
            color: #3b82f6;
            font-weight: bold;
        }

        /* === TEMA NOTIFIKASI OS (MIRIP FOTO KE 3) === */
        .os-notification {
            position: fixed;
            top: -150px; /* Sembunyi di atas layar */
            left: 50%;
            transform: translateX(-50%);
            width: 95%;
            max-width: 400px;
            background-color: rgba(241, 245, 249, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 15px 18px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: #1e293b;
            transition: top 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 9999;
        }

        /* Class buat munculin notifnya */
        .os-notification.show {
            top: 15px;
        }

        .notif-header {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 8px;
            font-size: 0.85rem;
            color: #64748b;
        }

        .notif-icon-wrapper {
            width: 20px;
            height: 20px;
            border-radius: 5px;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .notif-icon-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .notif-title {
            font-weight: 600;
            font-size: 1rem;
            margin-bottom: 4px;
            letter-spacing: -0.3px;
        }

        .notif-body {
            font-size: 0.95rem;
            line-height: 1.4;
            letter-spacing: -0.2px;
        }
    </style>
</head>
<body>

    <!-- KOTAK UTAMA APLIKASI (Mirip Foto 2) -->
    <div class="main-card">
        
        <!-- Pilihan E-Wallet / Bank -->
        <div class="input-group">
            <label>Pilih Jenis Notif</label>
            <select class="custom-input" id="app-type">
                <option value="dana">💰 DANA</option>
                <option value="gopay">🟢 GoPay</option>
                <option value="shopeepay">🟠 ShopeePay</option>
                <option value="bca">🏦 M-BCA</option>
            </select>
        </div>

        <div class="input-group">
            <label>Masukkan nama pengirim</label>
            <input type="text" class="custom-input" id="sender-name" placeholder="cth: Fajar" autocomplete="off">
        </div>

        <div class="input-group">
            <label>Masukkan nominal</label>
            <input type="text" class="custom-input" id="transfer-amount" placeholder="cth: Rp100.000" autocomplete="off">
        </div>

        <div class="timer-label">Timer Available:</div>
        
        <div class="timer-grid">
            <button class="btn-timer" onclick="startFakeNotif(10)">
                <span>10</span><span>DETIK</span>
            </button>
            <button class="btn-timer" onclick="startFakeNotif(15)">
                <span>15</span><span>DETIK</span>
            </button>
            <button class="btn-timer" onclick="startFakeNotif(20)">
                <span>20</span><span>DETIK</span>
            </button>
            <button class="btn-timer" onclick="startFakeNotif(50)">
                <span>50</span><span>DETIK</span>
            </button>
        </div>

        <div class="warning-box">
            Disarankan untuk mengisi <span>NAMA PENGIRIM & NOMINAL SALDO</span> sependek mungkin agar bisa terlihat seluruhnya dalam mode layar vertical.
        </div>
    </div>

    <!-- OVERLAY MENGHITUNG MUNDUR (Biar bisa siap-siap tutup aplikasi) -->
    <div id="countdown-overlay">
        <div style="color: #fff; font-size: 1.2rem; margin-bottom: 10px;">Notif muncul dalam...</div>
        <div id="countdown-number">10</div>
        <div style="color: #94a3b8; font-size: 0.9rem; margin-top: 20px;">Silakan keluar (Home) agar notif terlihat nyata</div>
    </div>

    <!-- ============================================== -->
    <!-- DESAIN NOTIFIKASI PALSU (Sembunyi di atas layar) -->
    <!-- ============================================== -->
    <div class="os-notification" id="fake-notif">
        <div class="notif-header">
            <div class="notif-icon-wrapper">
                <img id="n-icon" src="" alt="icon">
            </div>
            <span id="n-app-name" style="text-transform: uppercase;">DANA</span> • Sekarang
        </div>
        <div class="notif-title" id="n-title">DANA</div>
        <div class="notif-body" id="n-message">
            Hi, <span id="n-sender"></span> baru saja Kirim DANA ke kamu <span id="n-amount"></span> !
        </div>
    </div>

    <script>
        // Database Template Notifikasi dari Berbagai Aplikasi
        const appData = {
            dana: {
                appName: 'DANA',
                icon: 'https://upload.wikimedia.org/wikipedia/commons/7/72/Logo_dana_blue.svg', // Link logo asli DANA
                templateTitle: 'DANA',
                templateMsg: 'Hi, [NAMA] baru saja Kirim DANA ke kamu [NOMINAL] !' // Persis foto 3
            },
            gopay: {
                appName: 'Gojek',
                icon: 'https://upload.wikimedia.org/wikipedia/commons/8/86/Gopay_logo.svg',
                templateTitle: 'GoPay',
                templateMsg: 'Yeay! Saldo GoPay kamu nambah [NOMINAL] dari [NAMA].'
            },
            shopeepay: {
                appName: 'Shopee',
                icon: 'https://upload.wikimedia.org/wikipedia/commons/f/fe/Shopee.svg',
                templateTitle: 'ShopeePay',
                templateMsg: 'Isi Saldo berhasil. Saldo ShopeePay-mu telah bertambah [NOMINAL] dari [NAMA].'
            },
            bca: {
                appName: 'BCA mobile',
                icon: 'https://upload.wikimedia.org/wikipedia/commons/5/5c/Bank_Central_Asia.svg',
                templateTitle: 'BCA mobile',
                templateMsg: 'Transfer dari [NAMA] sebesar [NOMINAL] berhasil.'
            }
        };

        // Mesin Suara Notif (Biar makin *real* pas muncul)
        function playNotifSound() {
            try {
                let ctx = new (window.AudioContext || window.webkitAudioContext)();
                let osc = ctx.createOscillator();
                let gainNode = ctx.createGain();
                
                // Bikin nada notif standard kayak suara "Ting!"
                osc.type = 'sine';
                osc.frequency.setValueAtTime(900, ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(2000, ctx.currentTime + 0.1);
                
                gainNode.gain.setValueAtTime(0.5, ctx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.3);
                
                osc.connect(gainNode);
                gainNode.connect(ctx.destination);
                
                osc.start();
                osc.stop(ctx.currentTime + 0.3);
            } catch(e) {
                console.log("Suara tidak didukung di browser ini");
            }
        }

        // Fungsi Utama Jalanin Fake Notif
        function startFakeNotif(detik) {
            // Ambil data yang diketik
            const tipeApp = document.getElementById('app-type').value;
            let nama = document.getElementById('sender-name').value;
            let nominal = document.getElementById('transfer-amount').value;

            // Kalo kosong, kita kasih default aja wkwk
            if(!nama) nama = "Fajar";
            if(!nominal) nominal = "Rp100.000";

            // Ambil data dari database yang udah kita bikin di atas
            const dataApp = appData[tipeApp];

            // Rangkai Teks Notifnya
            let pesanNotif = dataApp.templateMsg;
            pesanNotif = pesanNotif.replace('[NAMA]', nama);
            pesanNotif = pesanNotif.replace('[NOMINAL]', nominal);

            // Masukin ke elemen HTML Notifnya
            document.getElementById('n-icon').src = dataApp.icon;
            document.getElementById('n-app-name').innerText = dataApp.appName;
            document.getElementById('n-title').innerText = dataApp.templateTitle;
            document.getElementById('n-message').innerText = pesanNotif;

            // Nyalain Layar Hitung Mundur
            let waktuTersisa = detik;
            const overlay = document.getElementById('countdown-overlay');
            const angkaMundur = document.getElementById('countdown-number');
            
            overlay.style.display = 'flex';
            angkaMundur.innerText = waktuTersisa;

            // Timer berjalan...
            const interval = setInterval(() => {
                waktuTersisa--;
                angkaMundur.innerText = waktuTersisa;

                // Kalo timer udah 0
                if (waktuTersisa <= 0) {
                    clearInterval(interval);
                    
                    // Sembunyiin layar hitung mundur
                    overlay.style.display = 'none';

                    // Munculin Notif Aslinya (Slide dari atas) + Suara
                    const notifElement = document.getElementById('fake-notif');
                    notifElement.classList.add('show');
                    playNotifSound();

                    // Notif ilang sendiri setelah 6 detik
                    setTimeout(() => {
                        notifElement.classList.remove('show');
                    }, 6000);
                }
            }, 1000); // Ngulang setiap 1 detik (1000ms)
        }
    </script>
</body>
</html>
